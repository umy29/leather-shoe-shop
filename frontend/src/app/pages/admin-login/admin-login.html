<div class="login-container">
  <div class="glass-panel login-card">
    <h2>Admin Access</h2>
    <p class="subtitle">Enter your credentials to manage inventory</p>
    
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group" style="text-align: left;">
        <label class="form-label" for="username">Username</label>
        <input 
          type="text" 
          id="username" 
          class="form-input" 
          [(ngModel)]="username" 
          name="username" 
          required>
      </div>
      
      <div class="form-group" style="text-align: left;">
        <label class="form-label" for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          class="form-input" 
          [(ngModel)]="password" 
          name="password" 
          required>
      </div>
      
      <button type="submit" class="btn-primary w-100" [disabled]="!loginForm.valid">
        Sign In
      </button>
    </form>
  </div>
</div>
