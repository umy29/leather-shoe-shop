<div class="auth-container">
  <div class="auth-card">
    <h2>{{ isLoginMode ? 'Welcome Back' : 'Create an Account' }}</h2>
    <p class="subtitle">{{ isLoginMode ? 'Login to access your orders and checkout faster.' : 'Sign up to get started.' }}</p>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Username</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          [(ngModel)]="username" 
          required 
          placeholder="Enter your username">
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="password" 
          required 
          placeholder="Enter your password">
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="!username || !password">
        {{ isLoginMode ? 'Login' : 'Sign Up' }}
      </button>
    </form>

    <div class="toggle-mode">
      <p>
        {{ isLoginMode ? "Don't have an account?" : "Already have an account?" }}
        <a href="javascript:void(0)" (click)="toggleMode()">
          {{ isLoginMode ? 'Sign up here' : 'Login here' }}
        </a>
      </p>
    </div>
  </div>
</div>
